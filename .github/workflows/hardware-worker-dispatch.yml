name: Syqnal Hardware Worker

on:
  repository_dispatch:
    types: [trigger-audit]

permissions:
  contents: read

jobs:
  hardware-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Decode payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          # This repository is public, and so are its run logs. Read the payload
          # from the event file instead of templating it into this script (which
          # the log prints), and mask its secrets before any step can echo them.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          payload = event.get("client_payload") or {}
          secrets = [payload.get("callback_token")]
          secrets += [run.get("upload_url") for run in payload.get("runs") or [] if isinstance(run, dict)]
          for secret in secrets:
              if secret:
                  print(f"::add-mask::{secret}")
          Path("/tmp/syqnal-payload.json").write_text(json.dumps(payload))
          PY
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/syqnal-payload.json").read_text())
          repo_url = str(payload.get("repo_url") or "").rstrip("/")
          if repo_url.endswith(".git"):
              repo_url = repo_url[:-4]
          prefix = "https://github.com/"
          repo = repo_url[len(prefix):] if repo_url.startswith(prefix) else repo_url
          if "/" not in repo:
              raise SystemExit(f"Invalid repo_url: {repo_url}")
          runs = payload.get("runs") or []
          types = {str(run.get("type") or "").upper() for run in runs}
          openlane_stage_types = {"SYNTHESIS", "PNR", "STA", "SILICON_DRC", "POWER", "LVS", "GDSII"}
          print(f"repo={repo}")
          print(f"branch={payload.get('branch') or 'main'}")
          print(f"project_slug={payload.get('project_slug') or ''}")
          for name, enabled in {
              "run_drc": "DRC" in types,
              "run_erc": "ERC" in types,
              "run_rtl_lint": "RTL_LINT" in types,
              "run_rtl_sim": "RTL_SIM" in types,
              "run_spice": "SPICE_SIM" in types,
              "run_bom": "BOM_PARSE" in types,
              "run_step": "STEP_VALID" in types,
              "run_gerber": "GERBER" in types,
              "run_synthesis": "SYNTHESIS" in types and not bool((openlane_stage_types - {"SYNTHESIS"}) & types),
              "run_formal": "FORMAL" in types,
              "run_gdsii": "GDSII" in types and not bool((openlane_stage_types - {"GDSII"}) & types),
              "run_lvs": "LVS" in types and not bool((openlane_stage_types - {"LVS", "GDSII"}) & types),
              "run_openlane": bool(openlane_stage_types & types),
          }.items():
              print(f"{name}={'true' if enabled else 'false'}")
          PY

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.payload.outputs.repo }}
          ref: ${{ steps.payload.outputs.branch }}
          token: ${{ secrets.SYQNAL_TARGET_REPO_TOKEN || github.token }}

      - name: Run Syqnal Hardware CI
        uses: syqnal/hardware-ci@v2.5.9
        with:
          syqnal_project_slug: ${{ steps.payload.outputs.project_slug }}
          run_drc: ${{ steps.payload.outputs.run_drc }}
          run_erc: ${{ steps.payload.outputs.run_erc }}
          run_rtl_lint: ${{ steps.payload.outputs.run_rtl_lint }}
          run_rtl_sim: ${{ steps.payload.outputs.run_rtl_sim }}
          run_spice: ${{ steps.payload.outputs.run_spice }}
          run_bom: ${{ steps.payload.outputs.run_bom }}
          run_step: ${{ steps.payload.outputs.run_step }}
          run_gerber: ${{ steps.payload.outputs.run_gerber }}
          run_synthesis: ${{ steps.payload.outputs.run_synthesis }}
          run_formal: ${{ steps.payload.outputs.run_formal }}
          run_gdsii: ${{ steps.payload.outputs.run_gdsii }}
          run_lvs: ${{ steps.payload.outputs.run_lvs }}
          run_openlane: ${{ steps.payload.outputs.run_openlane }}

      - name: Map results to Syqnal run ids
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/syqnal-payload.json").read_text())
          requested = payload.get("runs") or []
          artifact_path = Path("syqnal-verification.json")
          artifact = json.loads(artifact_path.read_text()) if artifact_path.exists() else {"checks": []}
          checks = artifact.get("checks") or []

          def norm_path(value):
              path = str(value or "").replace("\\", "/").strip()
              while path.startswith("./"):
                  path = path[2:]
              return path.lstrip("/")

          def type_of(item):
              return str(item.get("type") or "").upper()

          # hardware-ci emits one check per matching file in the repo (e.g. it
          # synthesizes every design file), so pair each requested run with the
          # check for the file Syqnal asked about first, then fall back to the
          # remaining checks of that type in order.
          pairs = []
          used_checks = set()
          used_runs = set()
          for run in requested:
              wanted = norm_path(run.get("file_path"))
              if not wanted:
                  continue
              for index, check in enumerate(checks):
                  if index in used_checks or type_of(check) != type_of(run):
                      continue
                  if norm_path(check.get("file")) == wanted:
                      pairs.append((run, check))
                      used_checks.add(index)
                      used_runs.add(id(run))
                      break
          for run in requested:
              if id(run) in used_runs:
                  continue
              for index, check in enumerate(checks):
                  if index in used_checks or type_of(check) != type_of(run):
                      continue
                  pairs.append((run, check))
                  used_checks.add(index)
                  used_runs.add(id(run))
                  break

          # Syqnal's callback runs on Vercel, which rejects request bodies over 4.5 MB.
          BULKY_KEYS = {"counterexample_vcd", "layout_preview_svg_b64", "layoutPreviewSvgB64", "vcdB64", "vcd_b64"}
          MAX_PREVIEW_CHARS = 512 * 1024

          def slim_summary(summary):
              summary = dict(summary)
              # The KLayout preview came twice (snake_case and camelCase); keep one, if it's small.
              summary.pop("layoutPreviewSvgB64", None)
              preview = summary.get("layout_preview_svg_b64")
              if isinstance(preview, str) and len(preview) > MAX_PREVIEW_CHARS:
                  summary.pop("layout_preview_svg_b64")
                  summary["layout_preview_dropped"] = "too large to send"
              return summary

          mapped = []
          for run, check in pairs:
              check_type = type_of(check)
              mapped.append({
                  "run_id": run.get("run_id"),
                  "type": check_type,
                  "file_path": norm_path(check.get("file")) or run.get("file_path") or "",
                  "status": check.get("status") or "ERROR",
                  "tool": check.get("tool"),
                  "tool_version": check.get("tool_version"),
                  "error_count": check.get("error_count", 0),
                  "warning_count": check.get("warning_count", 0),
                  "duration_ms": check.get("duration_ms"),
                  "violations": check.get("violations") or [],
                  "summary": slim_summary(check.get("summary") or {}),
                  "logs": json.dumps({**check, "summary": {k: v for k, v in (check.get("summary") or {}).items() if k not in BULKY_KEYS}}, indent=2)[:10000],
              })

          mapped_ids = {item.get("run_id") for item in mapped}
          for run in requested:
              if run.get("run_id") in mapped_ids:
                  continue
              mapped.append({
                  "run_id": run.get("run_id"),
                  "type": str(run.get("type") or "").upper(),
                  "file_path": run.get("file_path") or "",
                  "status": "ERROR",
                  "error_count": 1,
                  "warning_count": 0,
                  "violations": [{
                      "type": "missing_result",
                      "severity": "error",
                      "plain_text": "hardware-ci did not emit a result for this requested check.",
                      "items": [],
                  }],
                  "logs": json.dumps(artifact, indent=2)[:10000],
              })

          # A layout OpenLane built on this runner only exists here: upload it to
          # the URL Syqnal signed for that run, so the project page can show it.
          import urllib.request
          for item, (run, check) in zip(mapped, pairs):  # mapped starts with the pairs, in order
              upload_url = run.get("upload_url")
              gds_rel = (item.get("summary") or {}).get("gds_path")
              if item.get("type") != "GDSII" or not upload_url or not gds_rel:
                  continue
              gds = Path(norm_path(check.get("file"))).parent / gds_rel
              if not gds.is_file() or gds.stat().st_size > 200 * 1024 * 1024:
                  continue
              try:
                  with gds.open("rb") as body:
                      req = urllib.request.Request(upload_url, data=body, method="PUT", headers={
                          "Content-Type": "application/octet-stream",
                          "Content-Length": str(gds.stat().st_size),
                      })
                      urllib.request.urlopen(req, timeout=300).read()
                  summary = {k: v for k, v in item["summary"].items() if k != "layout_preview_svg_b64"}
                  item["summary"] = {**summary, "gds_uploaded": True}  # the page shows the real layout instead
                  print(f"Uploaded {gds_rel} ({gds.stat().st_size} bytes)")
              except Exception as exc:  # keep reporting results even if the upload fails
                  print(f"GDS upload failed: {exc}")

          body = json.dumps({"runs": mapped})
          print(f"Callback body: {len(body.encode()) / 1024:.0f} KB for {len(mapped)} run(s)")
          Path("/tmp/syqnal-results.json").write_text(body)
          PY

      - name: Report results to Syqnal
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          payload = json.loads(Path("/tmp/syqnal-payload.json").read_text())
          data = Path("/tmp/syqnal-results.json").read_bytes()
          request = urllib.request.Request(
              payload["callback_url"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {payload['callback_token']}",
                  "User-Agent": "Syqnal-Hardware-Worker/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print(response.read().decode("utf-8", errors="replace"))
          PY
